  datasource:
    url: jdbc:postgresql://localhost:5432/postgis?useSSL=false
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      # Pro 模型（洪水泥石流启动）输入支持 txt/asc（ESRI ASCII 未压缩，单文件可达数十 MB）
