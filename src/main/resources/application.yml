server:
  port: 8088
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgis?useSSL=false,public
    username: postgres
    password: 666888
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      # Pro 模型（洪水泥石流启动）输入支持 txt/asc（ESRI ASCII 未压缩，单文件可达数十 MB）
      max-file-size: 500MB
      max-request-size: 1GB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 部署时可覆盖以下配置:
# app:
#   project-root: ../backend                    # 项目根目录（默认当前绝对路径）
#   static-dir: ../nginx/html                   # PNG输出目录
#   python-exe: python/python.exe               # 嵌入式Python路径
#   conda-python-exe: D:/application/miniconda3/envs/geocompy/python.exe  # DL模型Python

app:
  avaflow-alpha:
    # 独立 EXE；留空时使用项目默认路径
    exe: E:/Projects/ZHLXT/算法/DepthAveraged2D_Windows_Sedongpu_Basic/DepthAveraged2D.exe
    # 留空即 <project-root>/suanfa/avaflow_alpha/jobs
    jobs-root: ""
    static-dir: E:/softwares/nginx-1.26.2/nginx-1.26.2/html
    static-subdir: avaflow_alpha
    source-crs: EPSG:32646
    timeout: 3600
    model: single-phase
    # 方案 A：通用默认动力学参数，不在前端暴露
    terrain-mode: 3
    source-mode: 2
    source-depth: 2.8
    source-update-mode: 1
    mu-coulomb: 0.27
    n-manning: 0.03

  # 洪水泥石流启动动力学模型（Pro / suanfa/Pro/python_port 数值内核）
  pro:
    # 任务目录（输入栅格 / work / progress.json）；留空即 <project-root>/suanfa/Pro/jobs
    jobs-root: ""
    # 数值内核包装脚本；留空即 <project-root>/suanfa/Pro/run_pro.py
    script: ""
    # 结果帧在 static-dir 下的子目录（前端通过 /ng/<subdir>/<jobId>/frames 访问）
    static-subdir: pro
    # 单次计算超时（秒）
    timeout: 3600
    # 默认最大输出帧数（超过则自动抽帧，保证动画流畅与出图速度）
    default-max-frames: 40
    # 默认输入数据目录（zB/zL/hW 等）；相对路径相对于 project-root
    default-input-dir: suanfa/Pro/user1/task
    # asc/txt 输入的坐标系（头部无 EPSG 时用于解释平面坐标与换算 bbox）
    source-crs: EPSG:32647
